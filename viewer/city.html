<title>Isometric Bonn</title>
<style>
/* Layout: the map is the whole page, edge to edge, with nothing drawn over it. The one colour
   of our own is the ground outside the city boundary: pale Rhine grey, slate in the dark.
   Drag, scroll, pinch, double-click and the keys (arrows, + and -, 0) move and zoom. */
:root {
  --outside: #d5dee5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --outside: #1e2529; color-scheme: dark; }
}
:root[data-theme="dark"] { --outside: #1e2529; color-scheme: dark; }

html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--outside); }
.map {
  position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--outside);
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.map.dragging { cursor: grabbing; }
.map img { position: absolute; left: 0; top: 0; max-width: none; image-rendering: pixelated; pointer-events: none; }
</style>

<div class="map" id="map" role="region"
     aria-label="Isometric pixel-art map of Bonn. Drag or use the arrow keys to move; scroll, pinch or press plus and minus to zoom; 0 shows the whole city."></div>

<script>
(() => {
  const T = {{tile_px}};
  const URL = "{{url}}";
  const LEVELS = {{levels}};
  const BOUNDS = {{bounds}};
  const START = {{start}};
  const MAXL = Math.max(...Object.keys(LEVELS).map(Number));
  const SCALES = [4, 2, 1];
  for (let l = 1; l <= MAXL; l++) SCALES.push(1 / 2 ** l);
  const have = {};
  for (const [l, keys] of Object.entries(LEVELS)) have[l] = new Set(keys);

  const map = document.getElementById("map");
  let si = SCALES.indexOf(START.scale) >= 0 ? SCALES.indexOf(START.scale) : 2;
  let cx = START.x, cy = START.y;
  const shown = new Map();

  function draw() {
    cx = Math.min(Math.max(cx, BOUNDS[0]), BOUNDS[2]);
    cy = Math.min(Math.max(cy, BOUNDS[1]), BOUNDS[3]);
    const s = SCALES[si];
    const L = s >= 1 ? 0 : Math.round(Math.log2(1 / s));
    const k = s * 2 ** L;
    const vw = map.clientWidth, vh = map.clientHeight;
    const left = Math.round(vw / 2 - (cx / 2 ** L) * k);
    const top = Math.round(vh / 2 - (cy / 2 ** L) * k);
    const size = T * k;
    const x0 = Math.floor(-left / size), x1 = Math.floor((vw - left) / size);
    const y0 = Math.floor(-top / size), y1 = Math.floor((vh - top) / size);
    const used = new Set();
    const place = (lv, x, y, sz, z) => {
      const key = lv + "/" + x + "_" + y;
      used.add(key);
      let img = shown.get(key);
      if (!img) {
        img = document.createElement("img");
        img.alt = "";
        img.src = URL.replace("{z}", lv).replace("{x}", x).replace("{y}", y);
        map.appendChild(img);
        shown.set(key, img);
      }
      img.style.zIndex = z;
      img.style.width = img.style.height = sz + "px";
      const f = sz / size;  // a coarser tile covers f x f tiles of this level
      img.style.transform = "translate(" + (left + x * f * size) + "px," + (top + y * f * size) + "px)";
    };
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const name = x + "_" + y;
        if (have[L] && have[L].has(name)) { place(L, x, y, size, 2); continue; }
        // Missing at this level (a lighter preview): show the nearest coarser tile, scaled up.
        for (let up = 1; L + up <= MAXL; up++) {
          const px = x >> up, py = y >> up;
          if (have[L + up] && have[L + up].has(px + "_" + py)) { place(L + up, px, py, size * 2 ** up, 1); break; }
        }
      }
    }
    for (const [key, img] of shown) if (!used.has(key)) { img.remove(); shown.delete(key); }
  }

  function zoomTo(n, mx, my) {
    n = Math.max(0, Math.min(SCALES.length - 1, n));
    if (n === si) return;
    const vw = map.clientWidth, vh = map.clientHeight;
    if (mx === undefined) { mx = vw / 2; my = vh / 2; }
    const s0 = SCALES[si], s1 = SCALES[n];
    const px = cx + (mx - vw / 2) / s0, py = cy + (my - vh / 2) / s0;
    cx = px - (mx - vw / 2) / s1;
    cy = py - (my - vh / 2) / s1;
    si = n;
    draw();
  }

  function whole() {
    const vw = map.clientWidth, vh = map.clientHeight;
    const w = BOUNDS[2] - BOUNDS[0], h = BOUNDS[3] - BOUNDS[1];
    si = SCALES.findIndex(s => w * s <= vw && h * s <= vh);
    if (si < 0) si = SCALES.length - 1;
    cx = (BOUNDS[0] + BOUNDS[2]) / 2;
    cy = (BOUNDS[1] + BOUNDS[3]) / 2;
    draw();
  }

  const pointers = new Map();
  let pinchBase = 0;
  map.addEventListener("pointerdown", e => {
    map.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    map.classList.add("dragging");
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchBase = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  map.addEventListener("pointermove", e => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const now = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, now);
    if (pointers.size === 1) {
      const s = SCALES[si];
      cx -= (now.x - prev.x) / s;
      cy -= (now.y - prev.y) / s;
      draw();
    } else if (pointers.size === 2 && pinchBase > 0) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const r = map.getBoundingClientRect();
      const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      if (d / pinchBase > 1.45) { zoomTo(si - 1, mx, my); pinchBase = d; }
      else if (d / pinchBase < 0.69) { zoomTo(si + 1, mx, my); pinchBase = d; }
    }
  });
  const release = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchBase = 0;
    if (pointers.size === 0) map.classList.remove("dragging");
  };
  map.addEventListener("pointerup", release);
  map.addEventListener("pointercancel", release);
  let wheel = 0;
  map.addEventListener("wheel", e => {
    e.preventDefault();
    wheel += e.deltaY;
    if (Math.abs(wheel) < 60) return;
    const r = map.getBoundingClientRect();
    zoomTo(si + (wheel > 0 ? 1 : -1), e.clientX - r.left, e.clientY - r.top);
    wheel = 0;
  }, { passive: false });
  map.addEventListener("dblclick", e => {
    const r = map.getBoundingClientRect();
    zoomTo(si - 1, e.clientX - r.left, e.clientY - r.top);
  });
  // Keys work page-wide: with nothing else on the page there is no focus to move first.
  window.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const step = 120 / SCALES[si];
    const keys = {
      ArrowLeft: () => { cx -= step; draw(); }, ArrowRight: () => { cx += step; draw(); },
      ArrowUp: () => { cy -= step; draw(); }, ArrowDown: () => { cy += step; draw(); },
      "+": () => zoomTo(si - 1), "=": () => zoomTo(si - 1), "-": () => zoomTo(si + 1), "0": whole,
    };
    if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
  });
  new ResizeObserver(draw).observe(map);
  draw();
})();
</script>
