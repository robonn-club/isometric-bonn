# All of Bonn: the city polygon from DVG1 (municipality key 05314000), 141 km2.
# Rendered in windows of 4 x 2 map tiles, each with a few pixels of overlap so the edges
# match (isobonn city bonn).
name: bonn
title: Bonn
municipality: "05314000"
window_px: [2048, 1024]
overlap_px: 4

