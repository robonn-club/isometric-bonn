  wall_shed:     ["#4A545A", "#5D686E", "#7A858A", "#97A1A5"]
  wall_church:   ["#93805F", "#B9A27A", "#E2CB9C", "#F8E8C0"]   # churches: pale honey stone
  window:        ["#293740", "#485F66"]   # Rhein 4 on the shade side, Rhein 3 in the sun
  solar:         ["#1B2740", "#26365A", "#33466F"]
  # cars, by the colour the photo shows: shade side, sun side, roof
  car_white:  ["#8E9598", "#C3C9CA", "#E8EBE9"]
  car_silver: ["#596268", "#858E93", "#AEB5B8"]
  car_black:  ["#191E23", "#262C32", "#39424A"]
  car_red:    ["#6A1E1D", "#982B28", "#C33F35"]
  car_blue:   ["#1D3152", "#294876", "#3A629A"]
  gold:          ["#8A6A1C", "#C99A2E", "#F2CF62"]   # the cross on a church top
  outline:       ["#16232A"]
  trunk:         ["#3D3225", "#55452F"]
  background:    ["#ECF1F5"]             # Rhein 1, outside the map
