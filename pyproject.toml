[project]
name = "isometric-bonn"
version = "0.1.0"
description = "Isometric pixel-art map of Bonn, built from NRW open data with fixed rules"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=2.2",
  "pillow>=12.2",
  "scipy>=1.15",
  "shapely>=2.1",
  "tifffile>=2025.5",
  "pyyaml>=6.0",
  "pyshp>=2.3",
]

[project.scripts]
isobonn = "isometric_bonn.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isometric_bonn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
